<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mentidero</title>
  <meta name="description" content="Cada día, tres palabras raras del español y tres definiciones. Solo una es verdad.">
  <meta name="theme-color" content="#f3e9d2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1712" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%239b2226'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23f3e9d2' font-family='Georgia,serif'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sheet">
    <header class="masthead">
      <button class="icon-btn" id="btn-help" type="button" aria-label="Cómo se juega">?</button>
      <div class="masthead__title">
        <h1>Mentidero</h1>
        <p class="masthead__sub" id="masthead-sub">Gaceta de verdades y bulos</p>
      </div>
      <button class="icon-btn" id="btn-stats" type="button" aria-label="Estadísticas">§</button>
    </header>

    <main id="app" aria-live="polite">
      <p class="loading">Componiendo el pliego…</p>
    </main>
  </div>

  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <div class="modal__body" id="modal-body"></div>
    <button class="btn btn--ghost modal__close" id="modal-close" type="button">Cerrar</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
