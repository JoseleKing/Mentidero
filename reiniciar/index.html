<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reiniciar Mentidero</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="../icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <div class="sheet">
    <header class="masthead">
      <div class="masthead__title">
        <h1>Mentidero</h1>
        <p class="masthead__sub">Reiniciar el juego</p>
      </div>
    </header>

    <main>
      <section class="screen screen--center" id="ask">
        <p class="kicker">Borrón y cuenta nueva</p>
        <p>Se borrarán tus partidas, la racha y las estadísticas guardadas en este navegador. No se puede deshacer.</p>
        <div class="stack">
          <button class="btn" id="btn-reset" type="button">Borrar mi progreso</button>
          <a class="btn btn--ghost" href="../" style="text-align:center;text-decoration:none;line-height:30px">Volver al juego</a>
        </div>
      </section>
      <section class="screen screen--center" id="done" hidden>
        <p class="kicker">Hecho</p>
        <p>Tu progreso se ha borrado. Volviendo al mentidero…</p>
      </section>
    </main>
  </div>

  <script>
    // Misma clave que CONFIG.STORAGE_KEY en app.js.
    var STORAGE_KEY = 'mentidero:v1';
    document.getElementById('btn-reset').addEventListener('click', function () {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* sin almacenamiento */ }
      document.getElementById('ask').hidden = true;
      document.getElementById('done').hidden = false;
      setTimeout(function () { location.href = '../'; }, 1200);
    });
  </script>
</body>
</html>
